name: CI

# Enforces PROTOCOL.md "CI green" for the CPU-reproducible ledger rows, and that the
# paper compiles with no undefined references. Tier-A discipline: no check requires
# GPU or Atlas -- Gate-B (GO-P-2026-020/021), GO-4 and GO-5-ADC are committed
# artifacts, re-derived for self-consistency but not re-run here.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce CPU-only claims (Tier-A)
    runs-on: ubuntu-latest
    # 45 -> 60 after the 085 cut: adding go14_density.py (CI #30) took the
    # Tier-A suite from 24m42s to 39m32s, leaving ~5 min of headroom under
    # the old cap. The harness runs 40 s locally and is far slower on the
    # runner, so the gap is runner-side, not a regression. Raised before the
    # next harness trips it rather than after a red run -- the same failure
    # the 073-era 20-min cap produced.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tier-A deps
        run: python -m pip install --upgrade pip -r ci/requirements-ci.txt
      - name: Reproduce verdicts + verify Appendix B
        run: python ci/reproduce.py

  paper:
    name: Compile paper (no undefined refs)
    runs-on: ubuntu-latest
    # 15 -> 30 as headroom, not because the job is near the limit: it builds
    # fifteen documents in 2m13s (measured 2026-08-08, run 31273951504). The
    # document count is what grows -- it went from three to fifteen in one
    # day -- so the cap is set against future growth rather than present cost.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile observation-theory.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: observation-theory.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Fail on undefined references / citations
        run: |
          cd paper
          if grep -qiE "there were undefined (references|citations)" observation-theory.log; then
            echo "::error::Undefined references or citations in observation-theory.log"
            grep -iE "warning:.*undefined|there were undefined" observation-theory.log || true
            exit 1
          fi
          echo "No undefined references or citations."
      - name: Compile IEEE T-IT manuscript (observation-theory-ieee.tex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: observation-theory-ieee.tex
          working_directory: paper/ieee
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Fail on undefined references / citations (IEEE)
        run: |
          cd paper/ieee
          if grep -qiE "there were undefined (references|citations)" observation-theory-ieee.log; then
            echo "::error::Undefined references or citations in observation-theory-ieee.log"
            grep -iE "warning:.*undefined|there were undefined" observation-theory-ieee.log || true
            exit 1
          fi
          echo "No undefined references or citations (IEEE)."
      # Every remaining standalone document in paper/. These were uncovered
      # until 2026-08-08: the GO-series drafts carry sealed results (GO-14
      # alone carries Theorems R/C, R1, W, D and the 076-085 chain), and an
      # uncompiled tex drifts from its committed PDF unnoticed -- which
      # go14's had, until the rebuild at b8200ee.
      # continue_on_error so a single bad document still reports the status of
      # all the others in the same run instead of masking them; the step (and
      # the job) still fails if any document fails.
      # NOTE: appendix-B-true-divergence.tex is deliberately absent -- it is
      # untracked. Add it here if it is ever committed.
      - name: Compile the GO-series and paper drafts
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            go14-causal-erasure.tex
            go11-conditional-region.tex
            go12-process-region.tex
            go13-dynamic-tax.tex
            go15-reference-coupled.tex
            complementarity-tax.tex
            consumer-relative-landauer.tex
            two-observer-theorem.tex
            paper-IV-consumer-relative-flip.tex
            paper-IV-tmlr.tex
            paper-VI-spectral-conditional.tex
            paper-VII-dynamic-tax.tex
          working_directory: paper
          latexmk_use_xelatex: false
          continue_on_error: true
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Fail on undefined references / citations (GO-series and drafts)
        run: |
          cd paper
          rc=0
          for f in go14-causal-erasure go11-conditional-region \
                   go12-process-region go13-dynamic-tax \
                   go15-reference-coupled complementarity-tax \
                   consumer-relative-landauer two-observer-theorem \
                   paper-IV-consumer-relative-flip paper-IV-tmlr \
                   paper-VI-spectral-conditional paper-VII-dynamic-tax; do
            if [ ! -f "$f.log" ]; then
              echo "::error::$f.log is missing -- the document did not compile"
              rc=1
              continue
            fi
            if grep -qiE "there were undefined (references|citations)" "$f.log"; then
              echo "::error::Undefined references or citations in $f.log"
              grep -iE "warning:.*undefined|there were undefined" "$f.log" || true
              rc=1
            fi
          done
          if [ $rc -eq 0 ]; then
            echo "No undefined references or citations in any GO-series or draft document."
          fi
          exit $rc
      - name: Compile cover letter
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cover-letter.tex
          working_directory: paper/ieee
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Compile graphical abstract
        uses: xu-cheng/latex-action@v3
        with:
          root_file: graphical-abstract.tex
          working_directory: paper/ieee
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Upload compiled PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdfs
          path: |
            paper/observation-theory.pdf
            paper/ieee/observation-theory-ieee.pdf
            paper/ieee/cover-letter.pdf
            paper/*.pdf
            paper/ieee/graphical-abstract.pdf
          if-no-files-found: warn
