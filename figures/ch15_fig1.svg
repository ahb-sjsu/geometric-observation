<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Seal before measure: the bar is fixed before the number exists"><rect width="100%" height="100%" fill="#0b1622"/><text x="18" y="27" font-family="'Crimson Pro', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#e8ecf0">Seal before measure: the bar is fixed before the number exists</text><line x1="40.00" y1="220.00" x2="690.00" y2="220.00" stroke="#8fa4b8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="690.00" y1="220.00" x2="683.14" y2="224.12" stroke="#8fa4b8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="690.00" y1="220.00" x2="683.14" y2="215.88" stroke="#8fa4b8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="690.00" y="238.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="end" font-weight="normal" font-style="italic">time</text><line x1="250.00" y1="134.00" x2="250.00" y2="300.00" stroke="#e78ac3" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" stroke-opacity="1.0"/><text x="40.00" y="66.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="start" font-weight="normal" font-style="italic">no governed number exists yet</text><text x="690.00" y="66.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="end" font-weight="normal" font-style="italic">measured only after the seal commit exists</text><circle cx="100.00" cy="220.00" r="7.00" fill="#0b1622"/><circle cx="100.00" cy="220.00" r="5.00" fill="#66c2a5"></circle><circle cx="370.00" cy="220.00" r="7.00" fill="#0b1622"/><circle cx="370.00" cy="220.00" r="5.00" fill="#66c2a5"></circle><circle cx="490.00" cy="220.00" r="7.00" fill="#0b1622"/><circle cx="490.00" cy="220.00" r="5.00" fill="#66c2a5"></circle><circle cx="620.00" cy="220.00" r="7.00" fill="#0b1622"/><circle cx="620.00" cy="220.00" r="5.00" fill="#66c2a5"></circle><circle cx="250.00" cy="220.00" r="8.00" fill="#0b1622"/><circle cx="250.00" cy="220.00" r="6.00" fill="#e78ac3"><title>seal: hash and git commit</title></circle><text x="40.00" y="158.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">prereg written</text><text x="40.00" y="174.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">claim, arms, sample size,</text><text x="40.00" y="190.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">pass/fail bar</text><text x="250.00" y="108.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="middle" font-weight="600">hashed and git-committed</text><text x="250.00" y="124.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">the binding timestamp (REG-1)</text><text x="370.00" y="246.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="middle" font-weight="600">DOI deposit</text><text x="370.00" y="262.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">external anchor (REG-3)</text><text x="490.00" y="174.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="middle" font-weight="600">first governed</text><text x="490.00" y="190.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="middle" font-weight="600">measurement</text><text x="620.00" y="174.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="middle" font-weight="600">outcome: pass or miss</text><text x="620.00" y="190.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">the sealed bar is not relaxed</text><line x1="250.00" y1="312.00" x2="680.00" y2="312.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="250.00" y1="306.00" x2="250.00" y2="318.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="680.00" y1="306.00" x2="680.00" y2="318.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="465.00" y="330.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="middle" font-weight="normal">amendments are appended after the sealed text, dated, with the reason (REG-2)</text><text x="465.00" y="350.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="middle" font-weight="normal" font-style="italic">the sealed text is never edited; CI checks that the hash still verifies</text></svg>