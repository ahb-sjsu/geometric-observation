<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-label="Five refuted proxies, each locating the next"><rect width="100%" height="100%" fill="#0b1622"/><text x="18" y="27" font-family="'Crimson Pro', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#e8ecf0">Five refuted proxies, each locating the next</text><rect x="30.00" y="56.00" width="300.00" height="52.00" rx="6" fill="#1a3248" stroke="#2a4a56" stroke-width="1"/><text x="180.00" y="79.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="middle" font-weight="600">NEG-5: the test as first registered</text><text x="180.00" y="95.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">missed 2 of 4 bars: a matched-bits confound</text><line x1="75.00" y1="108.00" x2="75.00" y2="152.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="75.00" y1="152.00" x2="123.00" y2="152.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="123.00" y1="152.00" x2="116.14" y2="156.12" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="123.00" y1="152.00" x2="116.14" y2="147.88" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><rect x="125.00" y="126.00" width="300.00" height="52.00" rx="6" fill="#1a3248" stroke="#2a4a56" stroke-width="1"/><text x="275.00" y="149.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="middle" font-weight="600">NEG-6: demeaned error norm</text><text x="275.00" y="165.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">fails to order the arms: magnitude is not it</text><line x1="170.00" y1="178.00" x2="170.00" y2="222.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="170.00" y1="222.00" x2="218.00" y2="222.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="218.00" y1="222.00" x2="211.14" y2="226.12" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="218.00" y1="222.00" x2="211.14" y2="217.88" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><rect x="220.00" y="196.00" width="300.00" height="52.00" rx="6" fill="#1a3248" stroke="#2a4a56" stroke-width="1"/><text x="370.00" y="219.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="middle" font-weight="600">NEG-7: a score of the compressor alone</text><text x="370.00" y="235.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">at fixed reconstruction, ranking flips with consumer</text><line x1="265.00" y1="248.00" x2="265.00" y2="292.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="265.00" y1="292.00" x2="313.00" y2="292.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="313.00" y1="292.00" x2="306.14" y2="296.12" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="313.00" y1="292.00" x2="306.14" y2="287.88" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><rect x="315.00" y="266.00" width="300.00" height="52.00" rx="6" fill="#1a3248" stroke="#2a4a56" stroke-width="1"/><text x="465.00" y="289.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="middle" font-weight="600">NEG-8: variance-ratio proxy</text><text x="465.00" y="305.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">Spearman 0.80 only: a noisy estimate of the trace</text><line x1="360.00" y1="318.00" x2="360.00" y2="362.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="360.00" y1="362.00" x2="408.00" y2="362.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="408.00" y1="362.00" x2="401.14" y2="366.12" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="408.00" y1="362.00" x2="401.14" y2="357.88" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><rect x="410.00" y="336.00" width="300.00" height="52.00" rx="6" fill="#1a3248" stroke="#2a4a56" stroke-width="1"/><text x="560.00" y="359.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="middle" font-weight="600">NEG-9: the direct trace tr(P_C Σ_δ)</text><text x="560.00" y="375.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="middle" font-weight="normal">flip 12/12, yet it misorders a middle pair</text><text x="450.00" y="78.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal" font-style="italic">[refuted], all five;</text><text x="450.00" y="94.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal" font-style="italic">each miss carried in the ledger</text><text x="30.00" y="396.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal" font-style="italic">ends at a statistic that is load-bearing</text><text x="30.00" y="412.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal" font-style="italic">but bounded</text></svg>