<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="The false-clear rate is conditional on the certificate clearing"><rect width="100%" height="100%" fill="#0b1622"/><text x="18" y="27" font-family="'Crimson Pro', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#e8ecf0">The false-clear rate is conditional on the certificate clearing</text><rect x="70" y="70" width="206.00" height="193.00" fill="#66c2a5" fill-opacity="0.75"><title>clears, upheld by the witness</title></rect><rect x="70" y="265.00" width="206.00" height="65.00" fill="#e78ac3"><title>clears, refuted by the witness</title></rect><rect x="278.00" y="70" width="52.00" height="260" fill="#1a3248" stroke="#2a4a56" stroke-width="1"><title>does not clear</title></rect><text x="174.00" y="171.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b1622" text-anchor="middle" font-weight="600">clears, upheld</text><text x="174.00" y="301.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0b1622" text-anchor="middle" font-weight="600">clears, refuted by W</text><text x="304.00" y="200.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="middle" font-weight="normal" transform="rotate(-90 304.00 200.00)">does not clear</text><line x1="70.00" y1="348.00" x2="276.00" y2="348.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="70.00" y1="342.00" x2="70.00" y2="354.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="276.00" y1="342.00" x2="276.00" y2="354.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="173.00" y="366.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="middle" font-weight="normal">coverage 0.80</text><line x1="56.00" y1="265.00" x2="56.00" y2="330.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="50.00" y1="265.00" x2="62.00" y2="265.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="50.00" y1="330.00" x2="62.00" y2="330.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="46.00" y="297.50" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="middle" font-weight="normal" transform="rotate(-90 46.00 297.50)">FC 0.25</text><text x="390.00" y="106.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="normal">coverage = Pr[ certificate clears ] = 0.80</text><text x="390.00" y="146.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">FC = Pr[ W refutes it | it clears ] = 0.25</text><text x="390.00" y="164.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">the height of the shaded part within the</text><text x="390.00" y="180.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">certificates that clear</text><text x="390.00" y="220.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="normal">joint = Pr[ clears and refuted ]</text><text x="390.00" y="238.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="normal">= 0.80 × 0.25 = 0.20</text><text x="390.00" y="256.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">the shaded area as a share of the square</text><text x="390.00" y="300.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="start" font-weight="normal" font-style="italic">clears everything: coverage 1,</text><text x="390.00" y="316.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="start" font-weight="normal" font-style="italic">so the joint rate equals FC</text><text x="16.00" y="390.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="start" font-weight="normal" font-style="italic">illustrative values, not measurements</text></svg>